name: Deploy SG Astra

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Get the code
        uses: actions/checkout@v4

      - name: Check JavaScript for errors
        run: |
          for f in *.js js/*.js; do
            if [ -f "$f" ]; then node --check "$f"; fi
          done

      - name: Arrange the site files
        run: |
          mkdir -p _site/css _site/js _site/icons
          cp index.html
