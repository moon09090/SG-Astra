name: Build Android (APK and AAB)

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    env:
      KS_PASS: ${{ secrets.KEYSTORE_PASSWORD }}
      KS_PATH: ${{ github.workspace }}/upload-keystore.jks
      VC: ${{ github.run_number }}
    steps:
      - uses: actions/checkout@v4
      - name: Check the secret exists
        run: |
          if [ -z "$KS_PASS" ]; then echo "::error::Add the repository secret KEYSTORE_PASSWORD first"; exit 1; fi
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21
      - run: npm install
      - name: Collect web files
        run: |
          mkdir www assets
          cp index.html style.css *.js www/
          cp manifest.webmanifest icon.svg icon-192.png icon-512.png www/ || true
          if [ -f icon-1024.png ]; then cp icon-1024.png assets/icon-only.png; cp icon-1024.png assets/icon-foreground.png; fi
      - run: npx cap add android
      - name: Allow the microphone
        run: sed -i 's#<application#<uses-permission android:name="android.permission.RECORD_AUDIO" />\n    <uses-permission android:name="android.permission.MODIFY_AUDIO_SETTINGS" />\n    <application#' android/app/src/main/AndroidManifest.xml
      - name: Make launcher icons
        continue-on-error: true
        run: npx --yes @capacitor/assets generate --android --iconBackgroundColor '#0e1746' --iconBackgroundColorDark '#0e1746'
      - run: npx cap sync android
      - name: Create the upload key (first run only)
        run: |
          if [ ! -f upload-keystore.jks ]; then
            keytool -genkeypair -storetype PKCS12 -keystore upload-keystore.jks -alias upload -keyalg RSA -keysize 2048 -validity 10000 -storepass "$KS_PASS" -keypass "$KS_PASS" -dname "CN=SG Astra, O=SG Astra, C=IN"
            git config user.name github-actions
            git config user.email actions@github.com
            git add upload-keystore.jks
            git commit -m "Add upload key"
            git push origin HEAD:main
          fi
      - name: Sign and build
        run: |
          python3 patch_gradle.py
          cd android
          chmod +x gradlew
          ./gradlew bundleRelease assembleRelease
      - name: Collect files
        run: |
          cp android/app/build/outputs/bundle/release/app-release.aab SG-Astra.aab
          cp android/app/build/outputs/apk/release/app-release.apk SG-Astra.apk
      - uses: actions/upload-artifact@v4
        with:
          name: SG-Astra-builds
          path: |
            SG-Astra.aab
            SG-Astra.apk
      - name: Publish release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release delete latest --yes --cleanup-tag || true
          gh release create latest SG-Astra.aab SG-Astra.apk --title "SG Astra for Android" --notes "SG-Astra.aab is for the Play Store. SG-Astra.apk installs directly on a phone."
