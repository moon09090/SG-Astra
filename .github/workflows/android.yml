name: Build Android APK

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  apk:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - run: npm install
      - name: Collect web files
        run: |
          mkdir www assets
          cp index.html style.css *.js www/
          cp manifest.webmanifest icon.svg icon-192.png icon-512.png www/ || true
          if [ -f icon-1024.png ]; then cp icon-1024.png assets/icon-only.png; cp icon-1024.png assets/icon-foreground.png; fi
      - run: npx cap add android
      - name: Make launcher icons
        continue-on-error: true
        run: npx --yes @capacitor/assets generate --android --iconBackgroundColor '#0e1746' --iconBackgroundColorDark '#0e1746'
      - run: npx cap sync android
      - name: Build APK
        run: |
          cd android
          chmod +x gradlew
          ./gradlew assembleDebug
      - name: Publish APK
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          cp android/app/build/outputs/apk/debug/app-debug.apk SG-Astra.apk
          gh release delete latest --yes --cleanup-tag || true
          gh release create latest SG-Astra.apk --title "SG Astra for Android" --notes "Download SG-Astra.apk and install it on your phone."
